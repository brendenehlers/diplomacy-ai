# Sample Diplomacy AI config.
# All calls go through the ngrok AI Gateway (https://gateway.ngrok.ai/v1).
# Set NGROK_API_KEY in .env before running.
#
# Model ids use the gateway's `provider:author/model` form, e.g.
#   "openai:openai/gpt-4o-mini", "anthropic:anthropic/claude-sonnet-4"
# Set `model` under a [powers.<NAME>] section to pit models against each other.
n_negotiation_rounds = 3
max_year = 1910
default_model = "openai:openai/gpt-5.6-luna"
# Omit `temperature` to let each model use its own default. Setting it explicitly
# makes gpt-5-family models reject the request with a 400.
# temperature = 0.7
timeout = 600

[powers.AUSTRIA]
# model = "anthropic:anthropic/claude-sonnet-4"
persona = "A ruthless expansionist. You negotiate freely, ally when it is useful, and betray the moment it nets you a center. Stalemate is failure; always be taking ground."

