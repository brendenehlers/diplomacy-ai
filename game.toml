# Sample Diplomacy AI config.
# Default model runs locally via LM Studio (OpenAI-compatible server).
# Before running, start LM Studio with the model loaded and set:
#   export LM_STUDIO_API_BASE=http://localhost:1234/v1
#   export LM_STUDIO_API_KEY=lm-studio   # any non-empty string
n_negotiation_rounds = 3
max_year = 1910
default_model = "lm_studio/qwen/qwen3-4b-thinking-2507"
temperature = 0.7
timeout = 60

[powers.FRANCE]
persona = "Cautious; prefers long-term alliances over early aggression."

[powers.TURKEY]
persona = "Opportunistic; strikes when neighbors are distracted."
